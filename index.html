  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;

    // events at the element — warn only; real JS errors carry message/error.

        e.target.tagName, String(e.target.src || e.target.href || ''));

    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';

    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).

    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;

            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();

            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);

        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });

        resourceBlobs[blobUrls[uuid]] = blob;
      }

    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

-align: center\">AGENT<\u002Fspan><span dir=\"ltr\" style=\"text-align: center\">SCORE<\u002Fspan><span dir=\"ltr\" style=\"text-align: center\">ACTION<\u002Fspan>\n                <\u002Fdiv>\n                <sc-for list=\"{{ qaRows }}\" as=\"r\" hint-placeholder-count=\"4\">\n                  <div style=\"display: grid; grid-template-columns: 1fr 90px 90px 130px; gap: 12px; padding: 14px 18px; border-bottom: 1px solid rgba(255,255,255,0.050); align-items: center;\">\n                    <span style=\"font-size: 13px; color: rgba(232,230,240,0.85);\">{{ r.topic }}<\u002Fspan>\n                    <span style=\"font-family: 'JetBrains Mono', monospace; font-size: 12px; color: rgba(232,230,240,0.71); text-align: center\">{{ r.agent }}<\u002Fspan>\n                    <span style=\"font-family: 'JetBrains Mono', monospace; font-size: 14px; font-weight: 600; color: {{ r.color }}; text-align: center\">{{ r.score }}<\u002Fspan>\n                    <span style=\"font-size: 12px; color: rgba(232,230,240,0.67); text-align: center\">{{ r.action }}<\u002Fspan>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n              <div style=\"display: flex; flex-direction: column; gap: 12px; padding: 20px; border-radius: 16px; background: rgba(105,27,191,0.08); border: 1px solid rgba(105,27,191,0.3);\">\n                <span style=\"font-family: Rubik; font-size: 9px; letter-spacing: 0.18em; color: #691bbf\" dir=\"ltr\">AUTO-ROUTED TO COACHING<\u002Fspan>\n                <div style=\"font-size: 18px; font-weight: 600;\">נציג #217<\u002Fdiv>\n                <div style=\"font-size: 13px; line-height: 1.65; color: rgba(232,230,240,0.75);\">זוהתה ירידה בטון בשיחות אחרי 16:00. נבנתה עבורו מודול אימון של 12 דקות עם 3 תרחישים מדומים.<\u002Fdiv>\n                <div style=\"display: flex; align-items: center; gap: 8px; padding: 10px 12px; border-radius: 10px; background: rgba(255,255,255,0.050); font-size: 12px; color: #7aabfb;\">שובץ אוטומטית start; max-width: 72%; padding: 11px 14px; border-radius: 14px 14px 14px 4px; background: rgba(255,255,255,0.050); border: 1px solid rgba(255,255,255,0.150); font-size: 13px; line-height: 1.55;\">חויבתי פעמיים על אותה הזמנה. זה לא מקובל, אני רוצה את הכסף עכשיו.<\u002Fdiv>\n                  <div style=\"align-self: flex-end; max-width: 72%; padding: 11px 14px; border-radius: 14px 14px 4px 14px; background: linear-gradient(135deg, rgba(54,201,209,0.2), rgba(43,95,231,0.2)); border: 1px solid rgba(43,95,231,0.3); font-size: 13px; line-height: 1.55;\">אני מבין לגמרי, זה ממש לא נעים. בודק את החיוב הכפול עכשיו ומחזיר לך תשובה תוך רגע.<\u002Fdiv>\n                  <div style=\"align-self: flex-start; max-width: 76%; display: flex; flex-direction: column; gap: 8px; padding: 12px 14px; border-radius: 14px; background: rgba(54,201,209,0.08); border: 1px solid rgba(54,201,209,0.3);\">\n                    <span style=\"font-family: 'JetBrains Mono', monospace; font-size: 9px; letter-spacing: 0.16em; color: #36c9d1;\" dir=\"ltr\">TRAINING COACH · LIVE TIP<\u002Fspan>\n                    <span style=\"font-size: 13px; line-height: 1.6;\">פתיחה מעולה — הכרת ברגש לפני שנתת פתרון. עכשיו נקוב בזמן מדויק: \"תוך 3 ימי עסקים\" עובד טוב יותר מ\"תוך רגע\".<\u002Fspan>\n                  <\u002Fdiv>\n                  <div style=\"align-self: flex-start; display: flex; align-items: center; gap: 6px; padding: 10px 14px; border-radius: 14px; background: rgba(255,255,255,0.050);\">\n                    <span style=\"width: 6px; height: 6px; border-radius: 50%; background: rgba(232,230,240,0.63); animation: pulseDot 1.2s ease-in-out infinite;\"><\u002Fspan>\n                    <span style=\"width: 6px; height: 6px; border-radius: 50%; background: rgba(232,230,240,0.63); animation: pulseDot 1.2s 0.2s ease-in-out infinite;\"><\u002Fspan>\n                    <span style=\"width: 6px; height: 6px; border-radius: 50%; background: rgba(232,230,240,0.63); animation: pulseDot 1.2s 0.4s ease-in-o 0d8b96\" dir=\"ltr\">EVERYTHING ON ONE PLATFORM<\u002Fspan>\n        <h2 style=\"margin: 0; font-size: 38px; line-height: 1.2; font-weight: 800; letter-spacing: -0.02em;\">הכל בפלטפורמה אחת — לא אוסף כלים<\u002Fh2>\n        <div style=\"display: flex; flex-direction: column; gap: 14px; margin-top: 6px;\">\n          <div style=\"display: flex; flex-direction: column; gap: 8px; padding: 20px; border-radius: 16px; background: #ffffff; border: 1px solid rgba(9,34,88,0.09); box-shadow: 0 14px 30px -22px rgba(9,34,88,0.5), 0 1px 2px rgba(9,34,88,0.04);\">\n            <div style=\"font-size: 18px; font-weight: 600;\">מקור ידע אחד<\u002Fdiv>\n            <div style=\"font-size: 14px; line-height: 1.65; color: rgba(9,34,88,0.66);\">כל שמונת המומחים שואבים מאותו מוח. עדכנתם מדיניות פעם אחת — כולם יודעים אותה מיד.<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display: flex; flex-direction: column; gap: 8px; padding: 20px; border-radius: 16px; background: #ffffff; border: 1px solid rgba(9,34,88,0.09); box-shadow: 0 14px 30px -22px rgba(9,34,88,0.5), 0 1px 2px rgba(9,34,88,0.04);\">\n            <div style=\"font-size: 18px; font-weight: 600;\">אותו מוח, בכל ערוץ<\u002Fdiv>\n            <div style=\"font-size: 14px; line-height: 1.65; color: rgba(9,34,88,0.66);\">אותה שיחה עוברת מטקסט לקול ובחזרה — בלחיצת כפתור, מתי שתבחרו, בלי לאבד הקשר.<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"position: relative; width: 100%; max-width: 620px; aspect-ratio: 620 / 520;\">\n        <svg sc-camel-view-box=\"0 0 620 520\" sc-camel-preserve-aspect-ratio=\"xMidYMid meet\" style=\"position: absolute; inset: 0; width: 100%; height: 100%;\">\n          <defs>\n            <linearGradient id=\"coreLine\" x1=\"0\" y1=\"0\" x2=\"1\" y2=\"1\">\n              <stop offset=\"0%\" stop-color=\"#36c9d1\"><\u002Fstop>\n              <stop offset=\"50%\" stop-color=\"#2b5fe7\"><\u002Fstop>\n              <stop offset=\"100%\" stop-color=\"#691bbf r-count=\"8\">\n          <div style=\"{{ n.style }}\">\n            <span style=\"font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 600; color: {{ n.color }};\" dir=\"ltr\">{{ n.code }}<\u002Fspan>\n            <span style=\"font-size: 10px; color: rgba(9,34,88,0.62); white-space: nowrap;\">{{ n.short }}<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <footer style=\"position: relative; z-index: 1; display: flex; align-items: center; justify-content: space-between; gap: 32px; max-width: 1360px; margin: 0 auto; padding: 40px; border-top: 1px solid rgba(9,34,88,0.13);\">\n    <div style=\"display: flex; align-items: center; gap: 14px;\">\n      <x-import component-from-global-scope=\"energy-orb\" from=\"c43c6de4-cb6e-40fb-87a2-6ae745f56f0d#/energy-orb.js\" size=\"34\" hint-size=\"34px,34px\"><\u002Fx-import>\n      <span dir=\"ltr\" style=\"font-size: 15px; font-weight: 700;\"><span style=\"color: #092258;\">One Platform. <\u002Fspan><span style=\"background: linear-gradient(90deg, #0d8b96, #2b5fe7, #691bbf); -webkit-background-clip: text; background-clip: text; color: transparent;\">Infinite Intelligence.<\u002Fspan><\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"display: flex; align-items: center; gap: 20px;\">\n      <img src=\"1b925933-a008-4424-8b2a-21075d5eba56\" alt=\"GAV Systems\" style=\"height: 16px; width: auto; opacity: 0.85;\"><span style=\"font-family: Rubik; font-size: 9px; letter-spacing: 0.2em; color: #6b7a99\" dir=\"ltr\">GAV INTELLIGENCE · POWERED BY<\u002Fspan>\n      \n    <\u002Fdiv>\n  <\u002Ffooter>\n\n\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{}\">\nclass Component extends DCLogic {\n  state = {\n    tab: 'customer', expert: 'CP', chatOpen: true, mode: 'text', step: 0, custCh: 'text',\n    msgs: [{ id: 0, who: 'ai', text: 'היי, אני ה-AI Agent של גב מערכות. איך אפשר לעזור?', isVoice: false }],\n    typing: false, draft: '', voiceTranscript: '', voiceSecs: 0,\n    sat: 0, fcr: 0, convos: 0, scan: 0,\n    copilotApplied: false, tone: 'formal', actionDone: false, recApproved: false,\n    agentDraft: 'מצטער על ההמתנה, אני '\n  };\n\n  get script() {\n    return [\n      { who: 'user', text: 'ההזמנה שלי #4821 עוד לא הגיעה, מחכה כבר 50 דקות. מה הסטטוס?' },\n      { who: 'ai', text: 'מצאתי: מועמדות #4821 למשרת QA Automation עברה לשלב ראיון מקצועי. יש שני מועדים פנויים — מחר 10:00 או חמישי 13:30. לקבע?' },\n      { who: 'user', text: 'אפשר פשוט לדבר? קל לי יותר' },\n      { who: 'ai', text: 'בטח. עוברים לשיחה קולית — ההקשר נשמר, לא צריך להתחיל מהתחלה.', switchTo: 'voice' },\n      { who: 'user', text: 'רגע, הראיון פרונטלי או בזום?', voice: '0:06' },\n      { who: 'ai', text: 'בזום, 45 דקות, עם ראש צוות הבדיקות. קבעתי לך מחר ב-10:00 ושלחתי אישור במייל וב-SMS.', voice: '0:11' },\n      { who: 'user', text: 'מעולה. תחזור לצ׳אט בבקשה', voice: '0:04' },\n      { who: 'ai', text: 'חזרנו לצ׳אט. הראיון מחר ב-10:00 מאושר, וכל השיחה הקולית שמורה כאן למעלה. עוד משהו?', switchTo: 'text' }\n    ];\n  }\n\n  get personaDefs() {\n    return [\n      { key: 'customer', num: '01', label: 'לקוח', tag: 'CUSTOMER APP · AI AGENT LIVE', note: 'אפליקציית לקוח · שיחה נפתרת ללא נציג' },\n      { key: 'agent', num: '02', label: 'נציג', tag: 'AGENT DESKTOP · COPILOT ON', note: 'שולחן עבודה של נציג · Copilot בזמן אמת' },\n      { key: 'manager', num: '03', label: 'מנהל', tag: 'MANAGER DASHBOARD · LIVE', note: 'דשבורד מנהל · מדדים חיים והמלצת AI' },\n      { key: 'insights', num: '04', label: 'תובנות', tag: 'INSIGHTS ANALYST · PATTERN FOUND', note: 'תובנות נסתרות · סניף, מוצר, סיבת שורש' },\n      { key: 'qa', num: '05', label: 'QA', tag: 'QA ENGINE · 100% COVERAGE', note: 'מנוע QA · סריקה מלאה וניקוד' },\n      { key: 'newhire', num: '06', label: 'עובד חדש', tag: 'TRAINING COACH · SIMULATION', note: 'סימולציית הכשרה · אימון ללא סיכון' },\n      { key: 'factory', num: '07', label: 'המומחה שאתם צריכים', tag: 'AGENT FACTORY · BUILD ON DEMAND', note: 'סוכן שנבנה על התהליך שלכם, לא מהמדף' }\n    ];\n  }\n\n  get expertDefs() {\n    return [\n      { code: 'CP', name: 'AI Copilot', desc: 'מציע ניסוח ותשובות לנציג בזמן אמת', c: '#0d8b96', rgb: '13,139,150' },\n      { code: 'QA', name: 'AI QA Expert', desc: 'סורק 100% מהשיחות ומנקד איכות', c: '#2b5fe7', rgb: '43,95,231' },\n      { code: 'KN', name: 'AI Knowledge Expert', desc: 'שולף את התשובה הנכונה ממסד הידע', c: '#691bbf', rgb: '105,27,191' },\n      { code: 'OP', name: 'AI Operations Manager', desc: 'מנטר עומסים ומאזן משמרות בזמן אמת', c: '#0f9aa2', rgb: '15,154,162' },\n      { code: 'TC', name: 'AI Training Coach', desc: 'מלווה נציגים חדשים באימון ובתרגול', c: '#0d8b96', rgb: '13,139,150' },\n      { code: 'IN', name: 'AI Insights Analyst', desc: 'מזהה מגמות ותובנות בכל השיחות', c: '#2b5fe7', rgb: '43,95,231' },\n      { code: 'AU', name: 'AI Automation Expert', desc: 'מריץ פעולות ותהליכים חוזרים אוטומטית', c: '#691bbf', rgb: '105,27,191' },\n      { code: 'BA', name: 'AI Business Advisor', desc: 'ממליץ על החלטות עסקיות מבוססות דאטה', c: '#0f9aa2', rgb: '15,154,162' }\n    ];\n  }\n\n  loadFreshchat() {\n    /* Append the widget as a normal body script — NOT via helmet/head,\n       which is what caused the widget's internal \"reading 'init'\" error. */\n    if (typeof document === 'undefined') return;\n    if (document.getElementById('gav-freshchat')) return;\n    var s = document.createElement('script');\n    s.id = 'gav-freshchat';\n    s.src = 'https://fw-cdn.com/16797405/7359416.js';\n    s.setAttribute('chat', 'true');\n    document.body.appendChild(s);\n  }\n\n  componentDidMount() {\n    this.loadFreshchat();\n    if (typeof window !== 'undefined' && window.innerWidth < 900) this.setState({ chatOpen: false });\n    this.ramp('sat', 94, 1100); this.ramp('fcr', 87, 1300); this.ramp('convos', 1247, 1600); this.ramp('scan', 214, 2600);\n  }\n\n  componentWillUnmount() {\n    (this.timers || []).forEach(clearInterval);\n    clearInterval(this.voiceTimer); clearTimeout(this.replyTimer);\n  }\n\n  ramp(key, target, dur) {\n    this.timers = this.timers || [];\n    const start = performance.now();\n    const t = setInterval(() => {\n      const p = Math.min(1, (performance.now() - start) / dur);\n      const e = 1 - Math.pow(1 - p, 3);\n      this.setState({ [key]: Math.round(target * e) });\n      if (p >= 1) clearInterval(t);\n    }, 40);\n    this.timers.push(t);\n  }\n\n  pushMsg(m) {\n    this.setState(s => ({ msgs: s.msgs.concat([Object.assign({ id: s.msgs.length + 1 }, m)]) }));\n  }\n\n  advanceStep = () => {\n    const step = this.script[this.state.step];\n    if (!step) return;\n    this.setState({ step: this.state.step + 1 });\n    if (step.who === 'user') {\n      if (step.voice) {\n        this.setState({ voiceTranscript: step.text });\n        this.pushMsg({ who: 'user', text: step.text, isVoice: true, voiceTag: 'VOICE ' + step.voice });\n      } else {\n        this.pushMsg({ who: 'user', text: step.text, isVoice: false });\n      }\n      clearTimeout(this.replyTimer);\n      this.replyTimer = setTimeout(() => this.aiReply(), 520);\n    } else {\n      this.aiReply();\n    }\n  };\n\n  aiReply() {\n    const step = this.script[this.state.step];\n    if (!step || step.who !== 'ai') return;\n    this.setState({ step: this.state.step + 1, typing: true, voiceTranscript: step.voice ? '' : this.state.voiceTranscript });\n    const chars = step.text.split('');\n    setTimeout(() => {\n      this.setState({ typing: false });\n      if (step.voice) this.setState({ voiceTranscript: '' });\n      this.pushMsg({ who: 'ai', text: '', isVoice: !!step.voice, voiceTag: step.voice ? 'VOICE ' + step.voice : '' });\n      let i = 0;\n      const t = setInterval(() => {\n        i += 2;\n        const partial = chars.slice(0, i).join('');\n        this.setState(s => {\n          const msgs = s.msgs.slice();\n          msgs[msgs.length - 1] = Object.assign({}, msgs[msgs.length - 1], { text: partial });\n          return { msgs: msgs, voiceTranscript: step.voice ? partial : s.voiceTranscript };\n        });\n        if (i >= chars.length) {\n          clearInterval(t);\n          if (step.switchTo) this.setMode(step.switchTo);\n        }\n      }, 22);\n      (this.timers = this.timers || []).push(t);\n    }, 700);\n  }\n\n  setMode(mode) {\n    this.setState({ mode: mode });\n    clearInterval(this.voiceTimer);\n    if (mode === 'voice') {\n      this.setState({ voiceSecs: 0 });\n      this.voiceTimer = setInterval(() => this.setState(s => ({ voiceSecs: s.voiceSecs + 1 })), 1000);\n    }\n  }\n\n  sendText = (text) => {\n    this.setState({ draft: '' });\n    this.pushMsg({ who: 'user', text: text, isVoice: this.state.mode === 'voice', voiceTag: 'VOICE 0:05' });\n    clearTimeout(this.replyTimer);\n    this.replyTimer = setTimeout(() => {\n      const step = this.script[this.state.step];\n      if (step && step.who === 'ai') this.aiReply(); else this.freeReply(text);\n    }, 520);\n  };\n\n  sendDraft = () => {\n    const text = this.state.draft.trim();\n    if (!text) { this.advanceStep(); return; }\n    this.setState({ draft: '' });\n    this.pushMsg({ who: 'user', text: text, isVoice: this.state.mode === 'voice', voiceTag: 'VOICE 0:05' });\n    clearTimeout(this.replyTimer);\n    this.replyTimer = setTimeout(() => {\n      const step = this.script[this.state.step];\n      if (step && step.who === 'ai') this.aiReply(); else this.freeReply(text);\n    }, 520);\n  };\n\n  sayAi(text, voiceTag) {\n    this.setState({ typing: true });\n    setTimeout(() => {\n      this.setState({ typing: false });\n      this.pushMsg({ who: 'ai', text: '', isVoice: !!voiceTag, voiceTag: voiceTag || '' });\n      const chars = String(text).split('');\n      let i = 0;\n      const t = setInterval(() => {\n        i += 2;\n        const partial = chars.slice(0, i).join('');\n        this.setState(s => {\n          const msgs = s.msgs.slice();\n          msgs[msgs.length - 1] = Object.assign({}, msgs[msgs.length - 1], { text: partial });\n          return { msgs: msgs, voiceTranscript: voiceTag ? partial : s.voiceTranscript };\n        });\n        if (i >= chars.length) clearInterval(t);\n      }, 22);\n      (this.timers = this.timers || []).push(t);\n    }, 650);\n  }\n\n  async freeReply(q) {\n    const brief = 'אתה ה-AI Agent של גב מערכות (GAV Systems) — קבוצה ישראלית עם למעלה מ-800 מומחים, שמספקת מוקדי שירות ומכירות במיקור חוץ, מרכזי תמיכה, בדיקות ואוטומציה, טכנולוגיה ופיתוח, יועצים מומחים, שירותי דיגיטל, גיוס ו-HR מנוהלים ו\"גב מהבית\". אתה חלק מ-GAV Intelligence: פלטפורמת AI אחת עם 8 מומחים דיגיטליים שכולם שואבים מאותו גרעין ידע, ואותה שיחה עוברת מטקסט לקול ובחזרה בלי לאבד הקשר. ענה בעברית, בטון מקצועי וחם, 1-3 משפטים, בלי סימני עיצוב.';\n    let ans = null;\n    try {\n      if (window.claude && window.claude.complete) ans = await window.claude.complete(brief + '\\n\\nשאלת המשתמש: ' + q);\n    } catch (e) { ans = null; }\n    if (!ans) ans = 'בטח. גב מערכות מפעילה מוקדי שירות ומכירות במיקור חוץ, מרכזי תמיכה, בדיקות ואוטומציה ופתרונות טכנולוגיה — עם יותר מ-800 מומחים. רוצה שאחבר אותך לאיש הצוות הרלוונטי?';\n    this.sayAi(String(ans).trim());\n  }\n\n  renderVals() {\n    const s = this.state;\n    const voiceMode = s.mode === 'voice';\n    const mm = Math.floor(s.voiceSecs / 60), ss = String(s.voiceSecs % 60).padStart(2, '0');\n\n    const personas = this.personaDefs.map(p => {\n      const on = p.key === s.tab;\n      return {\n        num: p.num, label: p.label,\n        select: () => this.setState({ tab: p.key }),\n        tabStyle: 'display: flex; align-items: center; gap: 10px; padding: 11px 18px; border-radius: 999px; cursor: pointer; font-family: Rubik, sans-serif; transition: all 0.2s; color: ' + (on ? '#ffffff' : 'rgba(9,34,88,0.66)') + '; background: ' + (on ? 'linear-gradient(120deg, #0d8b96, #2b5fe7 55%, #691bbf)' : '#ffffff') + '; border: 1px solid ' + (on ? 'transparent' : 'rgba(9,34,88,0.12)') +
